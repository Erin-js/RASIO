html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;

#widget &gt; svg {

svg.lucide {

  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;supplier-analysis-options&quot;&gt;
  &lt;style&gt;

    }
  &lt;/style&gt;

  &lt;h2&gt;Three stronger alternatives to a lollipop chart&lt;/h2&gt;
  &lt;div class=&quot;option-grid&quot;&gt;
    &lt;section&gt;
      &lt;h3&gt;1. Supply exposure map &lt;span class=&quot;recommendation&quot;&gt;Recommended&lt;/span&gt;&lt;/h3&gt;
      &lt;p class=&quot;chart-note text-small&quot;&gt;Concentration, production gap, and import volume in one view&lt;/p&gt;
      &lt;div class=&quot;chart&quot; data-chart=&quot;quadrant&quot; aria-label=&quot;Supply exposure bubble chart&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section&gt;
      &lt;h3&gt;2. The supplier-count illusion&lt;/h3&gt;
      &lt;p class=&quot;chart-note text-small&quot;&gt;Listed suppliers versus share-weighted effective suppliers&lt;/p&gt;
      &lt;div class=&quot;chart&quot; data-chart=&quot;paired&quot; aria-label=&quot;Listed and effective supplier comparison&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section&gt;
      &lt;h3&gt;3. Top-supplier stress scenario&lt;/h3&gt;
      &lt;p class=&quot;chart-note text-small&quot;&gt;An illustrative indicator for dependence on the largest supplier&lt;/p&gt;
      &lt;div class=&quot;chart&quot; data-chart=&quot;stress&quot; aria-label=&quot;Top-supplier stress scenario comparison&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;supplier-analysis-options&#x27;);
      const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const data = [
        { country: &#x27;Philippines&#x27;, label: &#x27;Philippines&#x27;, listed: 14, effective: 1.73, ratio: 8.1, hhi: 5782, top: 74.4, shortfall: 26.8, imports: 4770089, exposure: 19.9 },
        { country: &#x27;Brunei Darussalam&#x27;, label: &#x27;Brunei&#x27;, listed: 12, effective: 2.10, ratio: 5.7, hhi: 4769, top: 62.3, shortfall: 90.6, imports: 31286, exposure: 56.5 },
        { country: &#x27;Singapore&#x27;, label: &#x27;Singapore&#x27;, listed: 26, effective: 3.43, ratio: 7.6, hhi: 2912, top: 35.3, shortfall: 100.0, imports: 448503, exposure: 35.3 },
        { country: &#x27;Malaysia&#x27;, label: &#x27;Malaysia&#x27;, listed: 13, effective: 3.70, ratio: 3.5, hhi: 2704, top: 40.6, shortfall: 53.0, imports: 1695310, exposure: 21.5 }
      ];

      function svgElement(name, attributes = {}, value = &#x27;&#x27;) {
        const node = document.createElementNS(NS, name);
        Object.entries(attributes).forEach(([key, val]) =&gt; node.setAttribute(key, val));
        if (value) node.textContent = value;
        return node;
      }

      function addText(svg, x, y, value, attributes = {}) {
        svg.appendChild(svgElement(&#x27;text&#x27;, { x, y, ...attributes }, value));
      }

      function addLine(svg, x1, y1, x2, y2, attributes = {}) {
        svg.appendChild(svgElement(&#x27;line&#x27;, { x1, y1, x2, y2, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1, ...attributes }));
      }

      function paddedExtent(values, ratio = 0.08) {
        const low = Math.min(...values);
        const high = Math.max(...values);
        const span = Math.max(1, high - low);
        return [low - span * ratio, high + span * ratio];
      }

      function median(values) {
        const sorted = [...values].sort((a, b) =&gt; a - b);
        return (sorted[1] + sorted[2]) / 2;
      }

      function baseSvg(container, preferredHeight = 360) {
        const width = Math.max(320, Math.floor(container.getBoundingClientRect().width));
        const height = Math.max(330, Math.min(preferredHeight, Math.round(width * 0.85)));
        container.replaceChildren();
        const svg = svgElement(&#x27;svg&#x27;, { viewBox: `0 0 ${width} ${height}`, role: &#x27;img&#x27; });
        container.appendChild(svg);
        return { svg, width, height };
      }

      function addFrame(svg, x, y, width, height) {
        svg.appendChild(svgElement(&#x27;rect&#x27;, { x, y, width, height, fill: &#x27;transparent&#x27;, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1, &#x27;data-chart-frame&#x27;: &#x27;&#x27; }));
      }

      function drawQuadrant(container) {
        const { svg, width, height } = baseSvg(container, 390);
        svg.appendChild(svgElement(&#x27;title&#x27;, {}, &#x27;Supply exposure map for four ASEAN rice importers&#x27;));
        svg.appendChild(svgElement(&#x27;desc&#x27;, {}, &#x27;Supplier concentration is on the horizontal axis, projected production shortfall is on the vertical axis, and bubble area represents rice import volume.&#x27;));
        const margin = { top: 34, right: 30, bottom: 66, left: 76 };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;
        const xDomain = paddedExtent(data.map(d =&gt; d.hhi).concat(median(data.map(d =&gt; d.hhi))));
        const yDomain = paddedExtent(data.map(d =&gt; d.shortfall).concat(0, median(data.map(d =&gt; d.shortfall))));
        const x = value =&gt; margin.left + (value - xDomain[0]) / (xDomain[1] - xDomain[0]) * plotWidth;
        const y = value =&gt; margin.top + plotHeight - (value - yDomain[0]) / (yDomain[1] - yDomain[0]) * plotHeight;
        const medianHhi = median(data.map(d =&gt; d.hhi));
        const medianShortfall = median(data.map(d =&gt; d.shortfall));
        addFrame(svg, margin.left, margin.top, plotWidth, plotHeight);

        [3000, 4000, 5000].filter(t =&gt; t &gt; xDomain[0] &amp;&amp; t &lt; xDomain[1]).forEach(tick =&gt; {
          addLine(svg, x(tick), margin.top, x(tick), margin.top + plotHeight, { opacity: .55 });
          addText(svg, x(tick), margin.top + plotHeight + 20, tick.toLocaleString(&#x27;en-US&#x27;), { &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;secondary&#x27; });
        });
        [25, 50, 75, 100].filter(t =&gt; t &gt; yDomain[0] &amp;&amp; t &lt; yDomain[1]).forEach(tick =&gt; {
          addLine(svg, margin.left, y(tick), margin.left + plotWidth, y(tick), { opacity: .55 });
          addText(svg, margin.left - 10, y(tick) + 4, `${tick}%`, { &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;secondary&#x27; });
        });

        addLine(svg, x(medianHhi), margin.top, x(medianHhi), margin.top + plotHeight, { stroke: &#x27;var(--muted-foreground)&#x27;, &#x27;stroke-dasharray&#x27;: &#x27;4 4&#x27; });
        addLine(svg, margin.left, y(medianShortfall), margin.left + plotWidth, y(medianShortfall), { stroke: &#x27;var(--muted-foreground)&#x27;, &#x27;stroke-dasharray&#x27;: &#x27;4 4&#x27; });
        addText(svg, x(medianHhi) + 6, margin.top + 16, &#x27;sample median&#x27;, { class: &#x27;secondary&#x27; });

        const maxImports = Math.max(...data.map(d =&gt; d.imports));
        data.forEach(d =&gt; {
          const cx = x(d.hhi);
          const cy = y(d.shortfall);
          const radius = 8 + Math.sqrt(d.imports / maxImports) * 20;
          const fill = d.hhi &gt; medianHhi ? &#x27;var(--viz-series-5)&#x27; : &#x27;var(--viz-series-2)&#x27;;
          svg.appendChild(svgElement(&#x27;circle&#x27;, { cx, cy, r: radius, fill, opacity: .82 }));
          svg.appendChild(svgElement(&#x27;circle&#x27;, { cx, cy, r: Math.max(22, radius), fill: &#x27;transparent&#x27;, &#x27;data-tooltip&#x27;: `${d.country}: HHI ${d.hhi.toLocaleString(&#x27;en-US&#x27;)}; production shortfall ${d.shortfall.toFixed(1)}%; ${d.effective.toFixed(1)} effective suppliers; ${(d.imports / 1000000).toFixed(2)} million tonnes imported` }));
          const anchorEnd = cx &gt; width - 130;
          const labelX = anchorEnd ? cx - radius - 6 : cx + radius + 6;
          addText(svg, labelX, cy - 3, d.label, { &#x27;text-anchor&#x27;: anchorEnd ? &#x27;end&#x27; : &#x27;start&#x27;, class: &#x27;strong&#x27; });
          addText(svg, labelX, cy + 12, `${d.effective.toFixed(1)} effective`, { &#x27;text-anchor&#x27;: anchorEnd ? &#x27;end&#x27; : &#x27;start&#x27;, class: &#x27;secondary&#x27; });
        });

        addText(svg, margin.left + plotWidth / 2, height - 16, &#x27;Supplier concentration, HHI  →&#x27;, { &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;axis-title strong&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27; });
        svg.appendChild(svgElement(&#x27;text&#x27;, { x: 18, y: margin.top + plotHeight / 2, transform: `rotate(-90 18 ${margin.top + plotHeight / 2})`, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;axis-title strong&#x27;, &#x27;data-axis&#x27;: &#x27;y&#x27; }, &#x27;Projected production shortfall (%)&#x27;));
        addText(svg, margin.left + plotWidth, margin.top + plotHeight + 40, &#x27;Bubble area = 2024 imports&#x27;, { &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;secondary&#x27; });
      }

      function drawPaired(container) {
        const { svg, width, height } = baseSvg(container, 360);
        svg.appendChild(svgElement(&#x27;title&#x27;, {}, &#x27;Listed and effective suppliers for four ASEAN rice importers&#x27;));
        svg.appendChild(svgElement(&#x27;desc&#x27;, {}, &#x27;For every country, the effective supplier count is much smaller than the raw listed supplier count.&#x27;));
        const margin = { top: 34, right: 28, bottom: 58, left: 106 };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;
        const rows = [...data].sort((a, b) =&gt; b.ratio - a.ratio);
        const xDomain = paddedExtent([0, ...data.map(d =&gt; d.listed)], .04);
        const x = value =&gt; margin.left + (value - xDomain[0]) / (xDomain[1] - xDomain[0]) * plotWidth;
        addFrame(svg, margin.left, margin.top, plotWidth, plotHeight);
        [0, 10, 20].filter(t =&gt; t &gt;= xDomain[0] &amp;&amp; t &lt;= xDomain[1]).forEach(tick =&gt; {
          addLine(svg, x(tick), margin.top, x(tick), margin.top + plotHeight, { opacity: .55 });
          addText(svg, x(tick), margin.top + plotHeight + 20, `${tick}`, { &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;secondary&#x27; });
        });
        const rowHeight = plotHeight / rows.length;
        rows.forEach((d, index) =&gt; {
          const cy = margin.top + rowHeight * (index + .5);
          addText(svg, margin.left - 10, cy - 4, d.label, { &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;strong&#x27; });
          addText(svg, margin.left - 10, cy + 13, `${d.ratio.toFixed(1)}× gap`, { &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;secondary&#x27; });
          svg.appendChild(svgElement(&#x27;rect&#x27;, { x: x(0), y: cy - 11, width: x(d.listed) - x(0), height: 22, fill: &#x27;var(--muted)&#x27; }));
          svg.appendChild(svgElement(&#x27;rect&#x27;, { x: x(0), y: cy - 11, width: x(d.effective) - x(0), height: 22, fill: &#x27;var(--viz-series-1)&#x27; }));
          addText(svg, x(d.effective) + 6, cy + 4, d.effective.toFixed(1), { class: &#x27;strong&#x27; });
          addText(svg, Math.min(margin.left + plotWidth - 4, x(d.listed) + 6), cy + 4, `${d.listed} listed`, { &#x27;text-anchor&#x27;: x(d.listed) &gt; margin.left + plotWidth - 65 ? &#x27;end&#x27; : &#x27;start&#x27;, class: &#x27;secondary&#x27; });
        });
        addText(svg, margin.left + plotWidth / 2, height - 16, &#x27;Number of suppliers&#x27;, { &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;axis-title strong&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27; });
        svg.appendChild(svgElement(&#x27;text&#x27;, { x: 18, y: margin.top + plotHeight / 2, transform: `rotate(-90 18 ${margin.top + plotHeight / 2})`, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;axis-title strong&#x27;, &#x27;data-axis&#x27;: &#x27;y&#x27; }, &#x27;Importing country&#x27;));
      }

      function drawStress(container) {
        const { svg, width, height } = baseSvg(container, 360);
        svg.appendChild(svgElement(&#x27;title&#x27;, {}, &#x27;Illustrative top-supplier stress indicator&#x27;));
        svg.appendChild(svgElement(&#x27;desc&#x27;, {}, &#x27;Brunei has the highest illustrative exposure, followed by Singapore, Malaysia, and the Philippines.&#x27;));
        const margin = { top: 34, right: 42, bottom: 66, left: 106 };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;
        const rows = [...data].sort((a, b) =&gt; b.exposure - a.exposure);
        const xDomain = paddedExtent([0, ...data.map(d =&gt; d.exposure)], .06);
        const x = value =&gt; margin.left + (value - xDomain[0]) / (xDomain[1] - xDomain[0]) * plotWidth;
        addFrame(svg, margin.left, margin.top, plotWidth, plotHeight);
        [0, 20, 40].filter(t =&gt; t &gt;= xDomain[0] &amp;&amp; t &lt;= xDomain[1]).forEach(tick =&gt; {
          addLine(svg, x(tick), margin.top, x(tick), margin.top + plotHeight, { opacity: .55 });
          addText(svg, x(tick), margin.top + plotHeight + 20, `${tick}`, { &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;secondary&#x27; });
        });
        const rowHeight = plotHeight / rows.length;
        rows.forEach((d, index) =&gt; {
          const cy = margin.top + rowHeight * (index + .5);
          addText(svg, margin.left - 10, cy - 4, d.label, { &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;strong&#x27; });
          addText(svg, margin.left - 10, cy + 13, `${d.shortfall.toFixed(1)}% gap`, { &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;secondary&#x27; });
          svg.appendChild(svgElement(&#x27;rect&#x27;, { x: x(0), y: cy - 11, width: x(d.exposure) - x(0), height: 22, fill: index === 0 ? &#x27;var(--viz-series-5)&#x27; : &#x27;var(--viz-series-3)&#x27;, opacity: .86 }));
          addText(svg, x(d.exposure) + 6, cy + 4, d.exposure.toFixed(1), { class: &#x27;strong&#x27; });
        });

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;

    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;

    const request = ++positionRequest;

        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  const handlePointerOpen = (event) =&gt; {

      return;
    }

      trigger == null ||

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

      closeTooltip();
    }

    const trigger = getTrigger(event.target);

    }
  };

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {

    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
